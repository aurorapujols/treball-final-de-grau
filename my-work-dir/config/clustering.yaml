experiment_name: clustering

experiment_version: "1.0"     # training: 1.0-all     1.1-only_non_meteors
                              # evaluate: 1.0-stage3

paths:
  data_root: "../../../data/upftfg26/apujols/processed/original"
  datasets_dir: "../../../data/upftfg26/apujols/datasets"
  full_dataset: "../../../data/upftfg26/apujols/datasets/dataset_51700.csv"
  test_set: "../../../data/upftfg26/apujols/datasets/dataset_test.csv"
  test_set_labeled: "../../../data/upftfg26/apujols/datasets/dataset_test_labeled.csv"
  val_set: "../../../data/upftfg26/apujols/datasets/dataset_val.csv"
  train_set: "../../../data/upftfg26/apujols/datasets/dataset_train.csv"
  output_dir: "logs/training"
  train_features: "../../../data/upftfg26/apujols/results/features/ssl_features_ssl_final_model_5.0.npy"
  train_filenames: "../../../data/upftfg26/apujols/results/filenames/ssl_filenames_ssl_final_model_5.0.npy"

scan:
  epochs: 3
  sl_epochs: 3
  loader_batch_size: 64
  ssl_model_path: "../../../data/upftfg26/apujols/models/ssl_final_model_1.0.pt"
  backbone_dim: 512
  n_clusters: 20
  n_heads: 5
  n_neighbours: 50
  entropy_weight: 2.0
  lr_scan: 1e-4
  lr_selflabeling: 1e-5
  prototype_threshold: 0.80
  use_only_non_meteors: False
  evaluate_after: False

use_only_non_meteors: true

# k-search execution
ssl_model_path: "../../../data/upftfg26/apujols/models/ssl_final_model_1.0.pt"
batch_size: 128
k_search:
  k_min: 2
  k_max: 25
  n_init: 20
  use_gmm: false   # set true if you want BIC/AIC from GMM too

k_means:
  k: 20
  n_init: 20
  random_state: 42

models: 
  scan_stage2: "../../../data/upftfg26/apujols/models/scan_model_stage2.pth"
  scan_stage3: "../../../data/upftfg26/apujols/models/scan_model_stage3_selflabel.pth"